[package]
name = "mactriage"
version = "0.12.0"
edition = "2021"
description = "Severity-ranked triage of macOS crashes, panics, hangs, and performance problems"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
plist = "1"
comfy-table = "7"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[profile.release]
strip = true
lto = true
